services:
  - type: web
    name: isqolar
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SEED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
