<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IsQolar Chat</title>
<style>
  :root { --maroon: #8B0000; --gold: #FFC72C; --bg: #FAF7F4; --ink: #2B2522; --muted: #6B5E57; --line: #E4DAD2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { background: var(--maroon); color: #fff; padding: 12px 16px; }
  .head { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header h1 span { color: var(--gold); }
  .btn { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .btn-gold { background: var(--gold); color: var(--maroon); }
  .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); }
  .btn[hidden], #chips[hidden] { display: none; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  #thread.idle { min-height: 100%; justify-content: center; }
  @media (max-width: 600px) { #thread.idle { justify-content: flex-start; } }
  .botwrap { align-self: flex-start; max-width: 85%; display: flex; flex-direction: column; gap: 4px; }
  .botwrap .msg { max-width: 100%; }
  .name { font-size: 12px; font-weight: 700; color: var(--maroon); padding-left: 4px; }
  .linkchip { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; margin-top: 8px; border-radius: 999px; background: var(--gold); color: var(--maroon) !important; font-weight: 700; font-size: 14px; text-decoration: none; }
  .linkchip:hover { filter: brightness(.95); }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  .follow { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 85%; }
  .follow .chip { font-size: 12px; padding: 6px 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--maroon); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot a { color: var(--maroon); font-weight: 600; }
  .err { align-self: center; color: var(--maroon); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .retry { background: var(--gold); color: var(--maroon); padding: 6px 12px; }
  .saved { font-size: 11px; color: var(--muted); padding-left: 4px; font-style: italic; }
    .hello { text-align: center; color: var(--muted); margin: 24px 0 8px; }
  .hello b { color: var(--maroon); font-size: 22px; display: block; margin-bottom: 4px; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; text-align: left; max-width: 340px; color: var(--ink); font-family: inherit; }
  .chip small { display: block; color: var(--maroon); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: .05em; }
  form { border-top: 1px solid var(--line); background: #fff; padding: 12px 16px; }
  form .wrap { flex-direction: row; gap: 8px; }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; max-height: 120px; }
  textarea:focus { outline: 2px solid var(--gold); }
  #send { background: var(--maroon); color: #fff; border-radius: 12px; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><div class="head">
  <h1>IsQolar <span>Chat</span></h1>
  <button class="btn btn-gold" id="play">Play demo</button>
  <button class="btn btn-ghost" id="pause" hidden>Pause</button>
  <button class="btn btn-gold" id="stop" hidden>Stop</button>
</div></header>
<main id="log"><div class="wrap idle" id="thread">
  <div class="hello" id="hello"><b>Kumusta, Iskolar!</b>Ask about PUP Manila: FAQs, finding a room, or the queue.</div>
  <div id="chips"></div>
</div></main>
<form id="form"><div class="wrap">
  <textarea id="input" rows="1" maxlength="2000" placeholder="Ask IsQolar..." aria-label="Message"></textarea>
  <button class="btn" id="send" type="submit">Send</button>
</div></form>
<script>
(() => {
  const thread = document.getElementById("thread");
  const log = document.getElementById("log");
  const chips = document.getElementById("chips");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const playBtn = document.getElementById("play");
  const pauseBtn = document.getElementById("pause");
  const stopBtn = document.getElementById("stop");
  const history = [];
  let qa = [];

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function chipFor(href) {
    const room = /\?room=([A-Za-z0-9-]+)/.exec(href);
    const label = room ? "Open " + room[1].toUpperCase() + " on map" : href.startsWith("/checkin") ? "Check in" : "Open map";
    return '<a class="linkchip" href="' + href + '">' + esc(label) + "</a>";
  }
  const linkify = (s) => {
    const links = [];
    const text = esc(s).replace(/(?:\s+(?:at|sa|here)\b|:)?\s*(?:https?:\/\/[^\s/]+)?(\/(?:map|checkin)\.html(?:\?room=[A-Za-z0-9-]+)?)/g, (_m, href) => {
      if (!links.includes(href)) links.push(href);
      return "";
    }).replace(/[ \t]+([.,])/g, "$1").trim();
    return text + (links.length ? "<br>" + links.map(chipFor).join(" ") : "");
  };
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  const DOTS = '<span class="dots"><i></i><i></i><i></i></span>';
  function bubble(role, text) {
    const d = document.createElement("div");
    d.className = "msg " + role;
    if (role === "bot") {
      const w = document.createElement("div");
      w.className = "botwrap";
      w.innerHTML = '<div class="name">IsQolar</div>';
      w.appendChild(d);
      d.innerHTML = text ? linkify(text) : DOTS;
      thread.appendChild(w);
    } else {
      d.textContent = text;
      thread.appendChild(d);
    }
    scroll();
    return d;
  }
  const drop = (el) => (el.parentElement.classList.contains("botwrap") ? el.parentElement : el).remove();
  function hideHello() { document.getElementById("hello").hidden = true; chips.hidden = true; thread.classList.remove("idle"); }
  const asked = new Set();
  function showFollowUps() {
    thread.querySelectorAll(".follow").forEach((el) => el.remove());
    const next = qa.filter((q) => !asked.has(q.question)).slice(0, 3);
    if (!next.length) return;
    const row = document.createElement("div");
    row.className = "follow";
    for (const q of next) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = q.question;
      b.onclick = () => ask(q.question);
      row.appendChild(b);
    }
    thread.appendChild(row); scroll();
  }

  fetch("/chat/demo-qa.json").then((r) => r.json()).then((list) => {
    qa = list;
    for (const q of qa) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.innerHTML = "<small>" + esc(q.feature) + "</small>" + esc(q.question);
      b.onclick = () => ask(q.question);
      chips.appendChild(b);
    }
  });

  let inFlight = false;
  const norm = (t) => t.toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter((w) => w.length > 2);
  function savedAnswer(text) {
    const words = new Set(norm(text));
    let best = null, bestScore = 0;
    for (const q of qa) {
      const qw = new Set(norm(q.question));
      const inter = [...words].filter((w) => qw.has(w)).length;
      const score = inter / Math.max(1, new Set([...words, ...qw]).size);
      if (score > bestScore) { bestScore = score; best = q; }
    }
    return bestScore >= 0.5 ? best : null;
  }
  async function post() {
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history }) });
      const data = await r.json().catch(() => ({}));
      return { ok: r.ok, status: r.status, data };
    } catch {
      return { ok: false, status: 0, data: {} };
    }
  }
  async function attempt(text) {
    inFlight = true; sendBtn.disabled = true;
    const wait = bubble("bot", "");
    try {
      let res = await post();
      if (!res.ok && (res.status === 502 || res.status === 0)) {
        await new Promise((r) => setTimeout(r, 1500));
        res = await post();
      }
      if (res.ok) {
        wait.innerHTML = linkify(res.data.reply);
        history.push({ role: "assistant", content: res.data.reply });
        showFollowUps();
        return;
      }
      const saved = savedAnswer(text);
      if (saved) {
        const answer = saved.answer + (saved.link ? "\n" + saved.link : "");
        wait.innerHTML = linkify(answer);
        const tag = document.createElement("div");
        tag.className = "saved"; tag.textContent = "Saved answer (offline)";
        wait.parentElement.insertBefore(tag, wait.nextSibling);
        history.push({ role: "assistant", content: answer });
        showFollowUps();
        return;
      }
      drop(wait);
      const e = bubble("err", "");
      e.textContent = "Hindi ako maka-connect ngayon. Sorry! ";
      const retry = document.createElement("button");
      retry.type = "button"; retry.className = "btn retry"; retry.textContent = "Retry";
      retry.onclick = () => { if (inFlight) return; e.remove(); attempt(text); };
      e.appendChild(retry);
    } finally {
      inFlight = false; sendBtn.disabled = demo.running; scroll();
    }
  }
  async function ask(text) {
    if (demo.running || inFlight) return;
    text = text.trim(); if (!text) return;
    hideHello();
    asked.add(text);
    thread.querySelectorAll(".follow, .msg.err").forEach((el) => el.remove());
    bubble("user", text);
    history.push({ role: "user", content: text });
    while (history.length > 20) history.shift();
    await attempt(text);
  }

  document.getElementById("form").onsubmit = (e) => { e.preventDefault(); if (inFlight) return; const t = input.value; input.value = ""; ask(t); };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); } });

  // Demo mode: plays prerecorded audio and types it out. No API calls.
  const demo = { running: false, paused: false, audio: null, token: 0, typer: null };
  function setDemoUi() {
    playBtn.hidden = demo.running; pauseBtn.hidden = !demo.running; stopBtn.hidden = !demo.running;
    pauseBtn.textContent = demo.paused ? "Resume" : "Pause";
    input.disabled = demo.running; sendBtn.disabled = demo.running;
  }
  function playLine(src, el, text, token) {
    return new Promise((resolve) => {
      const a = new Audio(src); demo.audio = a;
      let shown = 0;
      const tick = () => {
        if (token !== demo.token) return resolve(false);
        const frac = a.duration ? Math.min(1, a.currentTime / a.duration) : 0;
        const n = Math.max(shown, Math.floor(frac * text.length));
        if (n !== shown) { shown = n; el.textContent = text.slice(0, n); scroll(); }
      };
      demo.typer = setInterval(tick, 50);
      const finish = () => { clearInterval(demo.typer); demo.audio = null; if (token !== demo.token) return resolve(false); if (el.classList.contains("bot")) el.innerHTML = linkify(text); else el.textContent = text; scroll(); resolve(true); };
      a.onended = finish;
      a.onerror = finish;
      a.play().catch(finish);
    });
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function runDemo() {
    const token = ++demo.token;
    demo.running = true; demo.paused = false; setDemoUi(); hideHello();
    thread.querySelectorAll(".follow").forEach((el) => el.remove());
    for (const q of qa) {
      const u = bubble("user", "");
      if (!(await playLine("/chat/audio/" + q.id + "-question.mp3", u, q.question, token))) return;
      await sleep(400); if (token !== demo.token) return;
      const b = bubble("bot", ""); await sleep(600); if (token !== demo.token) return;
      const answer = q.answer + (q.link ? "\n" + q.link : "");
      if (!(await playLine("/chat/audio/" + q.id + "-answer.mp3", b, answer, token))) return;
      await sleep(700); if (token !== demo.token) return;
    }
    stopDemo();
  }
  function stopDemo() {
    demo.token++; clearInterval(demo.typer);
    if (demo.audio) { demo.audio.pause(); demo.audio = null; }
    thread.querySelectorAll(".msg .dots").forEach((d) => drop(d.parentElement));
    demo.running = false; demo.paused = false; setDemoUi();
  }
  playBtn.onclick = runDemo;
  stopBtn.onclick = stopDemo;
  pauseBtn.onclick = () => {
    if (!demo.audio) return;
    demo.paused = !demo.paused;
    if (demo.paused) demo.audio.pause(); else demo.audio.play();
    setDemoUi();
  };
})();
</script>
</body>
</html>
