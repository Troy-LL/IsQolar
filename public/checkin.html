<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Check-in - IsQolar</title>
  <link rel="icon" href="/brand/logo-light.png" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --maroon: #880000;
      --maroon-deep: #5c0000;
      --gold: #ffcc00;
      --ink: #1f1a1a;
      --ink-soft: #5e5656;
      --line: #e2dcd8;
      --paper: #ffffff;
      --shell: #f7f4f2;
    }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--shell);
      color: var(--ink);
      padding:
        calc(16px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(16px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
    }
    .logo { height: 36px; width: auto; display: block; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .map-back {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 4px;
      margin-bottom: 4px;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-soft);
      text-decoration: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .map-back:active { transform: scale(0.97); }
    .map-back:focus-visible {
      outline: 3px solid var(--maroon-deep);
      outline-offset: 2px;
      border-radius: 4px;
    }
    @media (hover: hover) and (pointer: fine) {
      .map-back:hover { color: var(--maroon); }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--maroon);
      border-bottom: 3px solid var(--gold);
      padding-bottom: 8px;
    }
    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--maroon);
    }
    .field { margin-bottom: 16px; }
    input, select, textarea { font-size: 16px; }
    input, select {
      width: 100%;
      min-height: 48px;
      font-size: 18px;
      padding: 0 12px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }
    input:focus-visible, select:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
      border-color: var(--maroon);
    }
    button {
      width: 100%;
      min-height: 56px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: var(--maroon);
      color: var(--paper);
      cursor: pointer;
      border-bottom: 3px solid var(--gold);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }
    @media (hover: hover) and (pointer: fine) {
      button:hover:not(:disabled) { background: var(--maroon-deep); }
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #error {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--maroon);
      min-height: 1.4em;
    }
    @media (prefers-reduced-motion: reduce) {
      .map-back, button { transition: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <div class="brand"><img class="logo" src="/brand/logo-light.png" alt="IsQolar"><a class="map-back" href="/prototype/">Home</a><a class="map-back" href="/map.html">Map</a></div>
    <h1>Check-in</h1>
    <form id="checkin-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="course">Course</label>
        <select id="course" name="course" required>
          <option value="">Loading courses...</option>
        </select>
      </div>
      <button type="submit" id="submit">Get ticket</button>
    </form>
    <p id="error" role="alert"></p>
  </main>
  <script>
    (function () {
      var form = document.getElementById("checkin-form");
      var nameInput = document.getElementById("name");
      var courseSelect = document.getElementById("course");
      var submitBtn = document.getElementById("submit");
      var errorEl = document.getElementById("error");

      function courseFromStallId(id) {
        var dash = id.lastIndexOf("-");
        return dash > 0 ? id.slice(0, dash) : id;
      }

      function fillCourses(stalls) {
        var seen = {};
        var courses = [];
        for (var i = 0; i < stalls.length; i++) {
          var course = courseFromStallId(stalls[i].id);
          if (!seen[course]) {
            seen[course] = true;
            courses.push(course);
          }
        }
        courseSelect.textContent = "";
        var blank = document.createElement("option");
        blank.value = "";
        blank.textContent = courses.length ? "Select a course" : "No courses available";
        courseSelect.appendChild(blank);
        for (var c = 0; c < courses.length; c++) {
          var opt = document.createElement("option");
          opt.value = courses[c];
          opt.textContent = courses[c];
          courseSelect.appendChild(opt);
        }
      }

      fetch("/api/stalls")
        .then(function (res) {
          if (!res.ok) throw new Error("Could not load courses");
          return res.json();
        })
        .then(fillCourses)
        .catch(function () {
          courseSelect.textContent = "";
          var opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Could not load courses";
          courseSelect.appendChild(opt);
          errorEl.textContent = "Could not load courses from the hub.";
        });

      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        errorEl.textContent = "";
        submitBtn.disabled = true;
        var body = {
          name: nameInput.value.trim(),
          course: courseSelect.value
        };
        fetch("/api/tickets", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        })
          .then(function (res) {
            return res.text().then(function (text) {
              var parsed = null;
              try { parsed = text ? JSON.parse(text) : null; } catch (_e) { parsed = null; }
              return { status: res.status, text: text, json: parsed };
            });
          })
          .then(function (result) {
            if (result.status === 201 && result.json && result.json.id) {
              window.location.href = "/phone.html?id=" + encodeURIComponent(result.json.id);
              return;
            }
            if (result.status === 400) {
              var msg = (result.json && result.json.error) || result.text || "Request failed";
              errorEl.textContent = msg;
              return;
            }
            errorEl.textContent = (result.json && result.json.error) || result.text || "Request failed";
          })
          .catch(function () {
            errorEl.textContent = "Could not create ticket.";
          })
          .then(function () {
            submitBtn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
