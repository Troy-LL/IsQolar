<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IsQolar — PUP Enrollment Queue</title>
  <meta name="description" content="IsQolar: live queue management for first-year enrollment at PUP Manila.">

  <!-- Fonts (bundled woff2 — no CDN) -->
  <link rel="preload" href="fonts/AtkinsonHyperlegibleNext-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/AtkinsonHyperlegibleNext-Bold.woff2"    as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/AtkinsonHyperlegibleMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/AtkinsonHyperlegibleMono-Bold.woff2"    as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Cinzel-Bold.woff2"                      as="font" type="font/woff2" crossorigin>

  <!-- CSS load order: tokens, components, gradient, screens, landing (landing LAST) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gradient.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/landing.css">

  <!-- QR lib: classic script loaded BEFORE the module so window.qrcode is available -->
  <script src="js/vendor/qrcode.js"></script>
</head>
<body>
  <!-- aria-live region for dynamic status announcements (persists across renders) -->
  <div id="live-region" aria-live="polite" aria-atomic="true"
       style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;"></div>

  <!-- View mount point -->
  <main id="stage" tabindex="-1"></main>

  <!-- Hash router + store init -->
  <script type="module" src="app.js"></script>
</body>
</html>
